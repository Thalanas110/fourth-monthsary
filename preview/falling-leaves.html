<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Poem Lantern · Falling Leaves Preview</title>
  <style>
    :root {
      --background: #17121d;
      --foreground: #f2e8d8;
      --muted: #aaa0ae;
      --amber: #f7b567;
      --mono: "Courier New", monospace;
      --sans: "Trebuchet MS", Arial, sans-serif;
      --serif: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body { margin: 0; min-width: 320px; background: var(--background); color: var(--foreground); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    .preview-shell { isolation: isolate; min-height: 100svh; overflow: hidden; position: relative; }
    .scene-background { height: 100%; inset: 0; object-fit: cover; object-position: center; position: fixed; width: 100%; z-index: -3; }
    .background-veil { background: linear-gradient(180deg, rgba(11, 8, 16, .76), rgba(16, 11, 22, .56) 48%, rgba(18, 12, 24, .82)), linear-gradient(90deg, rgba(13, 9, 18, .76), rgba(13, 9, 18, .16) 53%, rgba(13, 9, 18, .62)); inset: 0; pointer-events: none; position: fixed; z-index: -2; }

    .hero { align-items: center; display: flex; isolation: isolate; min-height: 100svh; overflow: hidden; padding: 76px 40px 112px; position: relative; }
    .hero-copy { max-width: 690px; position: relative; z-index: 2; }
    .hero-kicker { align-items: center; color: var(--amber); display: flex; font: 500 10px var(--mono); gap: 12px; letter-spacing: .2em; text-transform: uppercase; }
    .hero-kicker::before { background: var(--amber); content: ""; height: 1px; width: 31px; }
    .hero-title { color: var(--foreground); font: 400 clamp(62px, 9vw, 126px)/.82 var(--serif); letter-spacing: -.055em; margin: 27px 0 30px; }
    .hero-title em { color: var(--amber); }
    .hero-description { color: var(--muted); font-size: 15px; line-height: 1.7; max-width: 385px; }
    .hero-rule { align-items: center; bottom: 42px; color: var(--muted); display: flex; font: 10px var(--mono); gap: 12px; letter-spacing: .1em; position: absolute; right: 40px; text-transform: uppercase; z-index: 2; }
    .hero-rule::before { background: rgba(242, 232, 216, .24); content: ""; height: 1px; width: 58px; }
    .scroll-mark { color: var(--amber); display: inline-block; font-size: 16px; }

    .hero-leaf-layer { inset: 0; overflow: hidden; pointer-events: none; position: absolute; z-index: 1; }
    .hero-leaf { animation: leaf-fall var(--leaf-duration) linear var(--leaf-delay) infinite; background: var(--leaf-color); border-radius: 75% 12% 75% 12%; clip-path: polygon(50% 0%, 91% 23%, 84% 66%, 50% 100%, 16% 66%, 9% 23%); contain: layout paint; height: var(--leaf-size); left: var(--leaf-left); opacity: 0; position: absolute; top: 0; transform-origin: center; width: var(--leaf-size); will-change: opacity, transform; }
    .hero-leaf::after { background: rgba(23, 18, 29, .28); content: ""; height: 1px; left: 18%; position: absolute; top: 50%; transform: rotate(-45deg); transform-origin: center; width: 70%; }

    @keyframes leaf-fall {
      0% { opacity: 0; transform: translate3d(0, -18vh, 0) rotate(var(--leaf-start-rotation)); }
      8% { opacity: var(--leaf-opacity); transform: translate3d(calc(var(--leaf-drift) * .08), 8vh, 0) rotate(calc(var(--leaf-start-rotation) + 26deg)); }
      20% { opacity: var(--leaf-opacity); transform: translate3d(calc(var(--leaf-drift) * .26), 20vh, 0) rotate(calc(var(--leaf-start-rotation) + 78deg)); }
      45% { opacity: var(--leaf-opacity); transform: translate3d(calc(var(--leaf-drift) * .58), 45vh, 0) rotate(calc(var(--leaf-start-rotation) + 142deg)); }
      70% { opacity: var(--leaf-opacity); transform: translate3d(calc(var(--leaf-drift) * .82), 70vh, 0) rotate(calc(var(--leaf-end-rotation) - 42deg)); }
      92% { opacity: var(--leaf-opacity); transform: translate3d(var(--leaf-drift), calc(100svh - 8vh), 0) rotate(var(--leaf-end-rotation)); }
      100% { opacity: 0; transform: translate3d(var(--leaf-drift), calc(100svh + 18vh), 0) rotate(calc(var(--leaf-end-rotation) + 24deg)); }
    }

    .performance-note { bottom: 20px; color: rgba(242, 232, 216, .62); font: 10px/1.5 var(--mono); left: 40px; letter-spacing: .04em; max-width: 250px; position: absolute; z-index: 3; }
    .performance-note strong { color: var(--amber); font-weight: 500; }

    @media (max-width: 800px) {
      .hero { min-height: 100svh; padding: 65px 20px 90px; }
      .hero-rule { bottom: 22px; left: 20px; right: auto; }
      .hero-leaf:nth-child(n + 16) { display: none; }
      .performance-note { bottom: 20px; left: 20px; max-width: 210px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-leaf-layer { display: none; }
    }
